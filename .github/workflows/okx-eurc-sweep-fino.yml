name: Barrido fino EURC USDC N15
on:
  push:
    paths:
      - 'okx-historico/eurc_sweep_fino.py'
      - '.github/workflows/okx-eurc-sweep-fino.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar NumPy y Numba
        run: python -m pip install numpy numba
      - name: Probar TP CB MM MC mas pequenos dejando N15
        run: |
          export PYTHONUNBUFFERED=1
          python okx-historico/eurc_sweep_fino.py 2>&1 | tee okx-historico/eurc_sweep_fino_ejecucion.log
      - name: Conservar resultados y auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EURC-barrido-fino-N15
          path: |
            okx-historico/eurc_grid_sweep_fino_resultados.json
            okx-historico/eurc_grid_sweep_fino_resumen.txt
            okx-historico/eurc_sweep_fino_ejecucion.log
          retention-days: 30
      - name: Publicar solo resultado legible
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add okx-historico/eurc_grid_sweep_fino_resumen.txt
          git commit -m 'EURC barrido N15 parametros mas pequenos [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
