name: Compilar miBot BTC-EUR APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Construir APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Extraer fuentes Android
        run: |
          mkdir -p unpack
          tar -xJf android-source-1.0.tar.xz -C unpack
          cp -a unpack/. .
          rm -rf unpack
          python3 tests/test_project.py

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Probar codificador binario
        run: |
          mkdir -p /tmp/mibot-bin-test
          javac -d /tmp/mibot-bin-test app/src/main/java/es/mibot/btceur/BinCodec.java tests/TestBinCodec.java
          java -cp /tmp/mibot-bin-test TestBinCodec

      - name: Preparar SDK Android disponible en GitHub
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then echo 'Falta sdkmanager'; exit 1; fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK instalable debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Validar APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256.txt

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: miBot-BTCEUR-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Crear descarga directa en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk miBot-BTCEUR-1.0.0-debug.apk
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 miBot-BTCEUR-1.0.0-debug.apk --clobber
          else
            gh release create v1.0.0 miBot-BTCEUR-1.0.0-debug.apk --title "miBot BTC/EUR Android 1.0.0" --notes "APK de prueba. Descarga velas BTC/EUR de Bitstamp para generar un BIN de 20 bytes compatible con miBot. No probado en dispositivo real."
          fi

