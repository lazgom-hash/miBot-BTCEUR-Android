name: Backtest miBot real OKX BTC-EUR frente BTC-USDC
on:
  push:
    paths:
      - 'okx-historico/analyze_okx.py'
      - '.github/workflows/okx-historico-backtest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencia numerica
        run: python -m pip install numpy
      - name: Descargar archivos originales OKX y ejecutar el mismo modelo
        run: |
          export PYTHONUNBUFFERED=1
          python okx-historico/analyze_okx.py 2>&1 | tee okx-historico/ejecucion.log
      - name: Publicar informes y trazabilidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OKX-comparacion-historica-reproducible
          path: |
            okx-historico/resultado_okx_real.json
            okx-historico/resumen_okx.txt
            okx-historico/ejecucion.log
          retention-days: 30
      - name: Guardar resultados legibles en repositorio
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add okx-historico/resultado_okx_real.json okx-historico/resumen_okx.txt
          git commit -m 'Datos originales OKX: comparacion miBot 3.5 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
