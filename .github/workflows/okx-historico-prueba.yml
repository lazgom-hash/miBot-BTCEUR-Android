name: OKX datos historicos - prueba de disponibilidad
on:
  push:
    paths:
      - '.github/workflows/okx-historico-prueba.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Consultar fuentes originales de OKX
        run: |
          mkdir -p okx-historico
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,time
          base='https://www.okx.com'
          tasks=[]
          for sym in ('BTC-EUR','BTC-USDC','BTC-USD'):
            for d in ('2024-10-01','2025-12-01','2026-09-01','2026-10-25'):
              from datetime import datetime,timezone
              ts=int(datetime.fromisoformat(d).replace(tzinfo=timezone.utc).timestamp()*1000)
              q={'instId':sym,'bar':'1H','after':str(ts),'limit':'2'}
              tasks.append((f'hour_{sym}_{d}','/api/v5/market/history-candles?'+urllib.parse.urlencode(q)))
          for syms in ('BTC-EUR','BTC-USDC','BTC-USD'):
            for year,month in ((2024,10),(2025,1),(2025,12),(2026,9)):
              from datetime import datetime,timezone
              import calendar
              a=int(datetime(year,month,1,tzinfo=timezone.utc).timestamp()*1000)
              y2,m2=(year+1,1) if month==12 else (year,month+1)
              z=int(datetime(y2,m2,1,tzinfo=timezone.utc).timestamp()*1000)-1
              q={'module':'2','instType':'SPOT','instIdList':syms,'dateAggrType':'monthly','begin':str(a),'end':str(z)}
              tasks.append((f'bulk_{syms}_{year}_{month}','/api/v5/public/market-data-history?'+urllib.parse.urlencode(q)))
          results={}
          for key,path in tasks:
            try:
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as r:
                result=json.load(r)
              results[key]={'code':result.get('code'),'msg':result.get('msg'),'data':result.get('data',[])[:5]}
            except Exception as e:
              details=str(e)
              try:details+=' '+e.read().decode('utf-8')[:500]
              except Exception:pass
              results[key]={'error':details}
            time.sleep(.4)
          open('okx-historico/diagnostico.json','w').write(json.dumps(results,ensure_ascii=False,indent=2))
          for k,x in results.items():print(k,x.get('code'),x.get('msg'),x.get('error'),str(x.get('data'))[:300])
          PY
      - name: Guardar prueba
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add okx-historico/diagnostico.json
          git commit -m 'Diagnostico OKX historico [skip ci]' || true
          git push origin HEAD:main
