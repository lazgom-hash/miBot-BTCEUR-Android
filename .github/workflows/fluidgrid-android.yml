name: FluidGrid Android APK
on:
  push:
    branches: [fluidgrid-android]
    paths: ['FluidGrid/**', '.github/workflows/fluidgrid-android.yml']
  pull_request:
    branches: [main]
    paths: ['FluidGrid/**', '.github/workflows/fluidgrid-android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de pruebas
        working-directory: FluidGrid
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FluidGrid-debug-APK
          path: FluidGrid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error