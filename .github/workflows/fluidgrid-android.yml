name: FluidGrid Android APK
on:
  push:
    branches: [fluidgrid-android]
    paths: ['FluidGrid/**', '.github/workflows/fluidgrid-android.yml']
  pull_request:
    branches: [main]
    paths: ['FluidGrid/**', '.github/workflows/fluidgrid-android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar clave de firma estable
        env:
          FLUIDGRID_KEYSTORE_B64: ${{ secrets.FLUIDGRID_KEYSTORE_B64 }}
          FLUIDGRID_STORE_PASS: ${{ secrets.FLUIDGRID_STORE_PASS }}
          FLUIDGRID_KEY_PASS: ${{ secrets.FLUIDGRID_KEY_PASS }}
          FLUIDGRID_KEY_ALIAS: ${{ secrets.FLUIDGRID_KEY_ALIAS }}
        run: |
          if [ -n "$FLUIDGRID_KEYSTORE_B64" ] && [ -n "$FLUIDGRID_STORE_PASS" ] && [ -n "$FLUIDGRID_KEY_PASS" ] && [ -n "$FLUIDGRID_KEY_ALIAS" ]; then
            mkdir -p FluidGrid/app/signing
            printf '%s' "$FLUIDGRID_KEYSTORE_B64" | base64 -d > FluidGrid/app/signing/fluidgrid-upload.jks
            echo "FLUIDGRID_KEYSTORE_PATH=$GITHUB_WORKSPACE/FluidGrid/app/signing/fluidgrid-upload.jks" >> "$GITHUB_ENV"
            echo "Firma estable: configurada"
          else
            echo "::warning::Firma estable NO configurada. APK debug: futuras actualizaciones pueden exigir reinstalación."
          fi
      - name: Compilar APK de pruebas
        working-directory: FluidGrid
        env:
          FLUIDGRID_STORE_PASS: ${{ secrets.FLUIDGRID_STORE_PASS }}
          FLUIDGRID_KEY_PASS: ${{ secrets.FLUIDGRID_KEY_PASS }}
          FLUIDGRID_KEY_ALIAS: ${{ secrets.FLUIDGRID_KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FluidGrid-debug-APK
          path: FluidGrid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK descargable sin iniciar sesión
        if: (github.event_name == 'push' && github.ref == 'refs/heads/fluidgrid-android') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fluidgrid-android' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp FluidGrid/app/build/outputs/apk/debug/app-debug.apk FluidGrid-1.7.apk
          if gh release view fluidgrid-v1.7.0 >/dev/null 2>&1; then
            gh release upload fluidgrid-v1.7.0 FluidGrid-1.7.apk --clobber
          else
            gh release create fluidgrid-v1.7.0 FluidGrid-1.7.apk \
              --target fluidgrid-android \
              --title "FluidGrid 1.7 · Testador BIN y actualizaciones" \
              --notes "Instalador APK de pruebas. Testador offline BIN histórico y comprobador de actualizaciones GitHub. Simulación BTC spot sin fondos reales. Descarga FluidGrid-1.7.apk desde Assets." \
              --prerelease
          fi
