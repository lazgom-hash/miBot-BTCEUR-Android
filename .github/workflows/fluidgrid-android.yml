name: FluidGrid Android APK
on:
  push:
    branches: [fluidgrid-android]
    paths: ['FluidGrid/**', '.github/workflows/fluidgrid-android.yml']
  pull_request:
    branches: [main]
    paths: ['FluidGrid/**', '.github/workflows/fluidgrid-android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de pruebas
        working-directory: FluidGrid
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FluidGrid-debug-APK
          path: FluidGrid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK descargable sin iniciar sesión
        if: (github.event_name == 'push' && github.ref == 'refs/heads/fluidgrid-android') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fluidgrid-android' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp FluidGrid/app/build/outputs/apk/debug/app-debug.apk FluidGrid-1.6.apk
          if gh release view fluidgrid-v1.6.0 >/dev/null 2>&1; then
            gh release upload fluidgrid-v1.6.0 FluidGrid-1.6.apk --clobber
          else
            gh release create fluidgrid-v1.6.0 FluidGrid-1.6.apk \
              --target fluidgrid-android \
              --title "FluidGrid 1.6 · Simulador Android" \
              --notes "Instalador APK de pruebas. Gráfico interactivo: desplazamiento con un dedo, zoom con dos dedos y controles +/-. Simulación BTC spot sin fondos reales. Descarga FluidGrid-1.6.apk desde Assets." \
              --prerelease
          fi
