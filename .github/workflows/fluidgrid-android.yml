name: FluidGrid Android APK
on:
  push:
    branches: [fluidgrid-android]
    paths: ['FluidGrid/**', '.github/workflows/fluidgrid-android.yml']
  pull_request:
    branches: [main]
    paths: ['FluidGrid/**', '.github/workflows/fluidgrid-android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar clave de firma estable
        env:
          FLUIDGRID_KEYSTORE_B64: ${{ secrets.FLUIDGRID_KEYSTORE_B64 }}
          FLUIDGRID_STORE_PASS: ${{ secrets.FLUIDGRID_STORE_PASS }}
          FLUIDGRID_KEY_PASS: ${{ secrets.FLUIDGRID_KEY_PASS }}
          FLUIDGRID_KEY_ALIAS: ${{ secrets.FLUIDGRID_KEY_ALIAS }}
        run: |
          if [ -n "$FLUIDGRID_KEYSTORE_B64" ] && [ -n "$FLUIDGRID_STORE_PASS" ] && [ -n "$FLUIDGRID_KEY_PASS" ] && [ -n "$FLUIDGRID_KEY_ALIAS" ]; then
            mkdir -p FluidGrid/app/signing
            printf '%s' "$FLUIDGRID_KEYSTORE_B64" | base64 -d > FluidGrid/app/signing/fluidgrid-upload.jks
            echo "FLUIDGRID_KEYSTORE_PATH=$GITHUB_WORKSPACE/FluidGrid/app/signing/fluidgrid-upload.jks" >> "$GITHUB_ENV"
            echo "Firma estable: configurada"
          else
            echo "::warning::Firma estable NO configurada. APK debug: futuras actualizaciones pueden exigir reinstalación."
          fi
      - name: Compilar APK de pruebas
        working-directory: FluidGrid
        env:
          FLUIDGRID_STORE_PASS: ${{ secrets.FLUIDGRID_STORE_PASS }}
          FLUIDGRID_KEY_PASS: ${{ secrets.FLUIDGRID_KEY_PASS }}
          FLUIDGRID_KEY_ALIAS: ${{ secrets.FLUIDGRID_KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FluidGrid-debug-APK
          path: FluidGrid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Copiar herramienta oficial de firma Android
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool-v35
          path: apksigner.jar
          if-no-files-found: error
      - name: Publicar FluidGrid 1.9.0 con firma permanente
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=FluidGrid/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          if [ -z "${FLUIDGRID_KEYSTORE_PATH:-}" ]; then
            echo "::error::No hay firma estable, se bloquea la publicación para proteger los datos instalados."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 26 --print-certs "$APK" > /tmp/fluidgrid-cert-info.txt
          if ! grep -qi '8d765b13774533c13281677f918de3b578b3d786f7cc24dfc8314f909d9def1b' /tmp/fluidgrid-cert-info.txt; then
            echo "::error::Certificado de firma distinto al de FluidGrid 1.8."
            exit 1
          fi
          mkdir -p downloads
          cp "$APK" downloads/FluidGrid-1.9.apk
          gh release view fluidgrid-v1.9.0 >/dev/null 2>&1 && \
            gh release upload fluidgrid-v1.9.0 "downloads/FluidGrid-1.9.apk" --clobber || \
            gh release create fluidgrid-v1.9.0 "downloads/FluidGrid-1.9.apk" \
            --target fluidgrid-android \
            --title "FluidGrid 1.9 · Mejor encuadre del gráfico" \
            --notes "APK firmada con el certificado permanente de 1.8. Ocho huecos a la derecha, zoom y desplazamiento preservados. Sin modificaciones de cartera ni estrategia." \
            --prerelease
